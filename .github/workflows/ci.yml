name: HimoyaAI CI & Model Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Generate synthetic dataset & train model
      run: |
        python ml/generate_dataset.py
        python ml/train.py

    - name: Run Model Gate Evaluation (Holdout Red Recall >= 0.95)
      run: |
        python ml/evaluate.py

    - name: Run Backend Pytest Suite & Zero-Log Invariant Tests
      run: |
        pytest backend/tests/ -v

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Frontend Dependencies
      run: npm ci

    - name: Run Deterministic Safety & Prompt Injection Tests
      run: npm test

    - name: Build Production Frontend
      run: npm run build
